    <text x="1180" y="385" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1d232f">testCase</text>
    <text x="1180" y="415" text-anchor="middle" font-size="20" font-family="Arial, Helvetica, sans-serif" fill="#1d232f">T-06</text>
