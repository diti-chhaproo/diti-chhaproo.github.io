    <text x="710" y="210" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#1d232f">Redesign Recommendation</text>

    <rect x="1060" y="120" width="240" height="110" rx="10" fill="#ffffff"/>
